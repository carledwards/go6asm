# flat-64k: a single 64 KB image. Code at $0200, vectors at $FFFA.
MEMORY {
    MAIN: start=$0000, size=$10000, type=rw, fill=yes, fillval=$00;
}
SEGMENTS {
    ZEROPAGE: load=MAIN, type=zp,  start=$0000;
    CODE:     load=MAIN, type=rw,  start=$0200;
    RODATA:   load=MAIN, type=rw;
    DATA:     load=MAIN, type=rw;
    BSS:      load=MAIN, type=bss;
    VECTORS:  load=MAIN, type=rw,  start=$FFFA;
}
