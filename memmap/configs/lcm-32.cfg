# lcm-32: carledwards/lcm-32 — bare-metal 6502 board. 8 KB RAM, two
# W65C22 VIAs ($6000, $8000), 8 KB ROM, vectors $FFFA. Map from
# carledwards/6502-simulator (examples/lcm32.ts).
MEMORY {
    RAM: start=$0000, size=$2000, type=rw;
    ROM: start=$E000, size=$2000, type=ro, fill=yes, fillval=$FF;
}
SEGMENTS {
    ZEROPAGE: load=RAM, type=zp;
    CODE:     load=ROM, type=ro;
    RODATA:   load=ROM, type=ro;
    DATA:     load=RAM, type=rw;
    BSS:      load=RAM, type=bss;
    VECTORS:  load=ROM, type=ro, start=$FFFA;
}
