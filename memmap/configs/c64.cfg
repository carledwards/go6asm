# c64.cfg — a plain Commodore 64 PRG image loaded at $0801 (BASIC
# program start). Prepend a "10 SYS …" BASIC stub yourself if you want
# the program to auto-run from LOAD"*",8,1 / RUN.
#
# Shared verbatim by ld65 (the byte-identical differential) and go6asm's
# memmap parser. ld65 needs `file=%O` on the region; memmap ignores it.
MEMORY {
    MAIN: start=$0801, size=$9700, type=rw, file=%O;
}
SEGMENTS {
    CODE:   load=MAIN, type=rw;
    RODATA: load=MAIN, type=rw;
    DATA:   load=MAIN, type=rw;
}
