# Shared by ld65 (the reference) and go6asm's memmap parser. Single
# output region; segments pack in listing order from $0200.
MEMORY {
    MAIN: file=%O, start=$0200, size=$FE00, type=rw;
}
SEGMENTS {
    CODE:   load=MAIN, type=rw;
    RODATA: load=MAIN, type=rw;
    DATA:   load=MAIN, type=rw;
}
